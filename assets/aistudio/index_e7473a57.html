<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语阶 GramStep · 英语语法学习</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="desk">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <aside class="brand-side">
    <div class="brand-logo">
      <span class="brand-mark">G</span>
      <div>
        <div class="brand-name">语阶 <em>GramStep</em></div>
        <div class="brand-sub">每天 10 分钟，把语法讲出来</div>
      </div>
    </div>
    <div class="brand-line"></div>
    <p class="brand-desc">分学段语法系统课 · AI 每日陪练 · 从自我介绍开始的演讲训练 · 错题回流闭环</p>
    <div class="brand-tags">
      <span>小学</span><span>初中</span><span>高中</span><span>四六级</span><span>职场</span>
    </div>
    <div class="brand-hint">
      <span class="dot"></span> 点击右侧手机屏幕，完整体验 5 个模块与 VIP 订阅流程
    </div>
    <div class="brand-foot">PRODUCT PROTOTYPE · 2026</div>
  </aside>

  <div class="phone">
    <div class="statusbar">
      <span class="sb-time">9:41</span>
      <span class="sb-island"></span>
      <span class="sb-icons">
        <svg viewBox="0 0 20 14" width="17" height="12"><path d="M1 10h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-3h2v12h-2z" fill="currentColor"/></svg>
        <svg viewBox="0 0 18 14" width="16" height="12"><path d="M9 13.2a1.4 1.4 0 100-2.8 1.4 1.4 0 000 2.8zM3.4 7.6a8 8 0 0111.2 0l-1.4 1.5a6 6 0 00-8.4 0zM.6 4.8a12 12 0 0116.8 0L16 6.3a10 10 0 00-14 0z" fill="currentColor"/></svg>
        <svg viewBox="0 0 26 13" width="24" height="12"><rect x="1" y="1.5" width="21" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.8" y="3.2" width="16" height="6.6" rx="1.8" fill="currentColor"/><path d="M23.5 5v3a2 2 0 000-3z" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar"></nav>
    <div class="homebar"><span></span></div>
  </div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
